# PaySprint Merchant Portal - production configuration (excerpt)

# Only non-sensitive actuator endpoints are exposed; env/heapdump can leak secrets.
management.endpoints.web.exposure.include=health,info
management.endpoint.env.show-values=NEVER

# Stack traces/messages are hidden from API clients in production to avoid leaking internals.
server.error.include-stacktrace=never
server.error.include-message=never
